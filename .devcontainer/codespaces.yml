services:
  windows:
    container_name: windows
    image: ghcr.io/dockur/windows
    environment:
      RAM_SIZE: "half"
      DISK_SIZE: "max"
      CPU_CORES: "max"
      DISK_MINIMUM: "1G"
      DISPLAY: "vnc"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 3389:3389/tcp
      - 3389:3389/udp
      - 5900:5900/tcp
    volumes:
      - ./windows:/storage
    restart: on-failure
    stop_grace_period: 2m
