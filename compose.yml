services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "11"
      DISPLAY: "vnc"        # raw VNC on 5900 instead of websocket-only noVNC
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006            # keep noVNC (optional, can remove once tailscale works)
      - 3389:3389/tcp
      - 3389:3389/udp
      - 5900:5900/tcp         # raw VNC, for LAN/local access without tailscale
    volumes:
      - ./windows:/storage
    restart: always
    stop_grace_period: 2m

  tailscale:
    image: tailscale/tailscale:latest
    container_name: windows-tailscale
    network_mode: service:windows   # shares windows' network namespace/IP stack
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}     # set in .env, e.g. tskey-auth-xxxxx
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: win-vm
      TS_EXTRA_ARGS: --accept-dns=false
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
    restart: unless-stopped
    depends_on:
      - windows
